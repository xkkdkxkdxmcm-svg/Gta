name: Build Ekran Asistani APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Generate Android project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate the complete Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/baret/ekranasistani
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'EkranAsistani'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.baret.ekranasistani'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.baret.ekranasistani'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <package android:name="com.zhiliaoapp.musically" />
                  <package android:name="com.ss.android.ugc.trill" />
                  <package android:name="com.google.android.youtube" />
                  <package android:name="com.android.chrome" />
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Ekran Asistanı"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScreenAccessibilityService"
                      android:exported="true"
                      android:label="Ekran Asistanı erişilebilirlik hizmeti"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="250"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="false"
              android:description="Ekrandaki erişilebilir metinleri okumak ve yalnızca onayladığınız arayüz işlemlerini yapmak için kullanılır." />
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B7CFF</item>
                  <item name="android:statusBarColor">#080A10</item>
                  <item name="android:navigationBarColor">#080A10</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">#080A10</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/baret/ekranasistani/SecureStore.java <<'EOF'
          package com.baret.ekranasistani;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;

          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          final class SecureStore {
              private static final String PREFS = "secure_settings";
              private static final String KEY_NAME = "openrouter_api_key";
              private static final String ALIAS = "EkranAsistaniAesKey";

              private SecureStore() { }

              static void saveApiKey(Context context, String apiKey) throws Exception {
                  SecretKey secretKey = getOrCreateKey();
                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                  cipher.init(Cipher.ENCRYPT_MODE, secretKey);
                  byte[] encrypted = cipher.doFinal(apiKey.getBytes(StandardCharsets.UTF_8));
                  String packed = Base64.encodeToString(cipher.getIV(), Base64.NO_WRAP) + "." +
                          Base64.encodeToString(encrypted, Base64.NO_WRAP);
                  prefs(context).edit().putString(KEY_NAME, packed).apply();
              }

              static String readApiKey(Context context) throws Exception {
                  String packed = prefs(context).getString(KEY_NAME, null);
                  if (packed == null || !packed.contains(".")) return "";
                  String[] parts = packed.split("\\.", 2);
                  byte[] iv = Base64.decode(parts[0], Base64.NO_WRAP);
                  byte[] encrypted = Base64.decode(parts[1], Base64.NO_WRAP);
                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                  cipher.init(Cipher.DECRYPT_MODE, getOrCreateKey(), new GCMParameterSpec(128, iv));
                  return new String(cipher.doFinal(encrypted), StandardCharsets.UTF_8);
              }

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              private static SecretKey getOrCreateKey() throws Exception {
                  KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
                  keyStore.load(null);
                  java.security.Key existing = keyStore.getKey(ALIAS, null);
                  if (existing instanceof SecretKey) return (SecretKey) existing;

                  KeyGenerator generator = KeyGenerator.getInstance(
                          KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                  generator.init(new KeyGenParameterSpec.Builder(ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setRandomizedEncryptionRequired(true)
                          .build());
                  return generator.generateKey();
              }
          }
          EOF

          cat > app/src/main/java/com/baret/ekranasistani/OpenRouterClient.java <<'EOF'
          package com.baret.ekranasistani;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          final class OpenRouterClient {
              private static final String BASE = "https://openrouter.ai/api/v1";

              static final class Model {
                  final String id;
                  final String name;
                  final boolean free;
                  Model(String id, String name, boolean free) {
                      this.id = id;
                      this.name = name;
                      this.free = free;
                  }
                  @Override public String toString() {
                      return name + (free ? "  ·  ÜCRETSİZ" : "");
                  }
              }

              private OpenRouterClient() { }

              static List<Model> fetchModels(String apiKey) throws Exception {
                  String body = request("GET", BASE + "/models", apiKey, null);
                  JSONObject root = new JSONObject(body);
                  JSONArray data = root.optJSONArray("data");
                  if (data == null) throw new IOException("Model listesi yanıtı beklenen biçimde değil.");

                  List<Model> result = new ArrayList<>();
                  result.add(new Model("openrouter/free", "OpenRouter otomatik ücretsiz model", true));
                  for (int i = 0; i < data.length(); i++) {
                      JSONObject item = data.optJSONObject(i);
                      if (item == null) continue;
                      String id = item.optString("id", "").trim();
                      if (id.isEmpty()) continue;
                      String name = item.optString("name", id);
                      JSONObject pricing = item.optJSONObject("pricing");
                      boolean free = id.endsWith(":free");
                      if (pricing != null) {
                          String prompt = pricing.optString("prompt", "");
                          String completion = pricing.optString("completion", "");
                          free = free || (isZero(prompt) && isZero(completion));
                      }
                      result.add(new Model(id, name, free));
                  }
                  return result;
              }

              static String chat(String apiKey, String model, String systemPrompt,
                                 String userPrompt) throws Exception {
                  JSONObject payload = new JSONObject();
                  payload.put("model", model);
                  payload.put("temperature", 0.35);
                  JSONArray messages = new JSONArray();
                  messages.put(new JSONObject().put("role", "system").put("content", systemPrompt));
                  messages.put(new JSONObject().put("role", "user").put("content", userPrompt));
                  payload.put("messages", messages);
                  String body = request("POST", BASE + "/chat/completions", apiKey, payload.toString());
                  JSONObject root = new JSONObject(body);
                  JSONArray choices = root.optJSONArray("choices");
                  if (choices == null || choices.length() == 0) {
                      throw new IOException("OpenRouter yanıtında choices alanı bulunamadı.");
                  }
                  JSONObject message = choices.getJSONObject(0).optJSONObject("message");
                  if (message == null) throw new IOException("Model boş bir yanıt döndürdü.");
                  Object content = message.opt("content");
                  if (content instanceof String) return ((String) content).trim();
                  if (content instanceof JSONArray) {
                      JSONArray parts = (JSONArray) content;
                      StringBuilder text = new StringBuilder();
                      for (int i = 0; i < parts.length(); i++) {
                          JSONObject part = parts.optJSONObject(i);
                          if (part != null) text.append(part.optString("text", ""));
                      }
                      return text.toString().trim();
                  }
                  throw new IOException("Model metin yanıtı döndürmedi.");
              }

              private static boolean isZero(String value) {
                  try { return Double.parseDouble(value) == 0.0d; }
                  catch (Exception ignored) { return false; }
              }

              private static String request(String method, String address, String apiKey,
                                            String payload) throws Exception {
                  HttpURLConnection connection = (HttpURLConnection) new URL(address).openConnection();
                  connection.setRequestMethod(method);
                  connection.setConnectTimeout(20000);
                  connection.setReadTimeout(45000);
                  connection.setRequestProperty("Authorization", "Bearer " + apiKey);
                  connection.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                  connection.setRequestProperty("HTTP-Referer", "https://github.com/");
                  connection.setRequestProperty("X-Title", "Ekran Asistani Android");
                  try {
                      if (payload != null) {
                          connection.setDoOutput(true);
                          byte[] bytes = payload.getBytes(StandardCharsets.UTF_8);
                          connection.getOutputStream().write(bytes);
                      }
                      int code = connection.getResponseCode();
                      InputStream stream = code >= 200 && code < 300
                              ? connection.getInputStream() : connection.getErrorStream();
                      String response = readAll(stream);
                      if (code < 200 || code >= 300) {
                          String detail = response;
                          try {
                              JSONObject errorRoot = new JSONObject(response);
                              JSONObject error = errorRoot.optJSONObject("error");
                              if (error != null) detail = error.optString("message", response);
                          } catch (Exception ignored) { }
                          throw new IOException("OpenRouter HTTP " + code + ": " + detail);
                      }
                      return response;
                  } finally {
                      connection.disconnect();
                  }
              }

              private static String readAll(InputStream stream) throws IOException {
                  if (stream == null) return "";
                  StringBuilder builder = new StringBuilder();
                  try (BufferedReader reader = new BufferedReader(
                          new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = reader.readLine()) != null) builder.append(line);
                  }
                  return builder.toString();
              }
          }
          EOF

          cat > app/src/main/java/com/baret/ekranasistani/ScreenAccessibilityService.java <<'EOF'
          package com.baret.ekranasistani;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.os.Handler;
          import android.os.Looper;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class ScreenAccessibilityService extends AccessibilityService {
              private static volatile ScreenAccessibilityService instance;
              private static volatile String latestSnapshot = "";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable captureTask = this::captureNow;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  captureNow();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  handler.removeCallbacks(captureTask);
                  handler.postDelayed(captureTask, 220);
              }

              @Override
              public void onInterrupt() { }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(captureTask);
                  if (instance == this) instance = null;
                  super.onDestroy();
              }

              static boolean isConnected() { return instance != null; }

              static String captureForUser() {
                  ScreenAccessibilityService service = instance;
                  if (service == null) return "";
                  service.captureNow();
                  return latestSnapshot;
              }

              private void captureNow() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) {
                      latestSnapshot = "Aktif pencerenin erişilebilir metin ağacı okunamadı. Uygulama içeriği bu özelliği engelliyor olabilir.";
                      return;
                  }
                  StringBuilder out = new StringBuilder();
                  int[] count = {0};
                  appendTree(root, out, count, 0);
                  latestSnapshot = out.length() == 0
                          ? "Ekranda erişilebilir metin bulunamadı. Bazı uygulamalar içeriklerini erişilebilirlik ağacına açmaz."
                          : out.toString();
              }

              private void appendTree(AccessibilityNodeInfo node, StringBuilder out,
                                     int[] count, int depth) {
                  if (node == null || count[0] >= 350 || out.length() >= 9000 || depth > 24) return;
                  count[0]++;
                  if (node.isPassword() || node.isEditable()) return;
                  if (!node.isPassword() && !node.isEditable()) {
                      CharSequence text = node.getText();
                      CharSequence description = node.getContentDescription();
                      String value = text == null ? "" : text.toString().trim();
                      String desc = description == null ? "" : description.toString().trim();
                      if (!value.isEmpty() || (!desc.isEmpty() && !desc.equals(value))) {
                          String label = value.isEmpty() ? desc : value;
                          if (!desc.isEmpty() && !desc.equals(value)) label += " · " + desc;
                          out.append(node.isClickable() ? "[TIKLANABILIR] " : "[METIN] ")
                                  .append(label.replace('\n', ' ')).append('\n');
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (count[0] >= 350 || out.length() >= 9000) break;
                      appendTree(node.getChild(i), out, count, depth + 1);
                  }
              }

              static String clickText(String requestedText) {
                  ScreenAccessibilityService service = instance;
                  if (service == null) return "Erişilebilirlik hizmeti etkin değil.";
                  if (requestedText == null || requestedText.trim().isEmpty()) return "Tıklanacak metin boş.";
                  AccessibilityNodeInfo root = service.getRootInActiveWindow();
                  if (root == null) return "Aktif ekran okunamadı.";
                  List<AccessibilityNodeInfo> exact = new ArrayList<>();
                  List<AccessibilityNodeInfo> partial = new ArrayList<>();
                  Set<Integer> seenExact = new HashSet<>();
                  Set<Integer> seenPartial = new HashSet<>();
                  service.findMatches(root, null, requestedText.trim(), exact, partial,
                          seenExact, seenPartial, 0);
                  List<AccessibilityNodeInfo> matches = exact.isEmpty() ? partial : exact;
                  if (matches.isEmpty()) return "Ekranda bu metinle eşleşen tıklanabilir bir öğe bulunamadı: " + requestedText;
                  if (matches.size() > 1) return "Aynı metne uyan birden fazla düğme var; güvenlik için tıklamadım. Daha net bir hedef belirtin.";
                  boolean ok = matches.get(0).performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  return ok ? "Tıklama Android tarafından kabul edildi: " + requestedText
                          : "Android tıklama işlemini gerçekleştiremedi.";
              }

              private void findMatches(AccessibilityNodeInfo node, AccessibilityNodeInfo clickableAncestor,
                                      String target, List<AccessibilityNodeInfo> exact,
                                      List<AccessibilityNodeInfo> partial, Set<Integer> seenExact,
                                      Set<Integer> seenPartial, int depth) {
                  if (node == null || depth > 24 || node.isPassword() || node.isEditable()) return;
                  AccessibilityNodeInfo currentClickable = node.isClickable() ? node : clickableAncestor;
                  if (!node.isPassword() && !node.isEditable()) {
                      String text = node.getText() == null ? "" : node.getText().toString().trim();
                      String desc = node.getContentDescription() == null ? "" : node.getContentDescription().toString().trim();
                      boolean exactMatch = text.equalsIgnoreCase(target) || desc.equalsIgnoreCase(target);
                      boolean partialMatch = !exactMatch && (text.toLowerCase().contains(target.toLowerCase()) ||
                              desc.toLowerCase().contains(target.toLowerCase()));
                      AccessibilityNodeInfo candidate = currentClickable;
                      if (candidate == null && node.isClickable()) candidate = node;
                      if (candidate != null && (exactMatch || partialMatch)) {
                          int identity = System.identityHashCode(candidate);
                          if (exactMatch && seenExact.add(identity)) exact.add(candidate);
                          else if (partialMatch && seenPartial.add(identity)) partial.add(candidate);
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      findMatches(node.getChild(i), currentClickable, target, exact, partial,
                              seenExact, seenPartial, depth + 1);
                  }
              }

              static String scroll(boolean forward) {
                  ScreenAccessibilityService service = instance;
                  if (service == null) return "Erişilebilirlik hizmeti etkin değil.";
                  AccessibilityNodeInfo root = service.getRootInActiveWindow();
                  if (root == null) return "Aktif ekran okunamadı.";
                  boolean done = service.scrollFirst(root, forward, 0);
                  return done ? "Kaydırma Android tarafından kabul edildi."
                          : "Kaydırılabilir bir alan bulunamadı.";
              }

              private boolean scrollFirst(AccessibilityNodeInfo node, boolean forward, int depth) {
                  if (node == null || depth > 24) return false;
                  if (node.isScrollable()) {
                      int action = forward ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                              : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD;
                      if (node.performAction(action)) return true;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (scrollFirst(node.getChild(i), forward, depth + 1)) return true;
                  }
                  return false;
              }
          }
          EOF

          cat > app/src/main/java/com/baret/ekranasistani/MainActivity.java <<'EOF'
          package com.baret.ekranasistani;

          import android.Manifest;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
