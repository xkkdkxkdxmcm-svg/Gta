              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private void connectAndLoad() {
                  String apiKey = keyInput.getText().toString().trim();
                  if (apiKey.isEmpty()) { setApiStatus("Önce OpenRouter API anahtarını girin.", true); return; }
                  connectButton.setEnabled(false);
                  setApiStatus("OpenRouter bağlantısı test ediliyor…", false);
                  worker.execute(() -> {
                      try {
                          List<OpenRouterClient.Model> models = OpenRouterClient.fetchModels(apiKey);
                          SecureStore.saveApiKey(this, apiKey);
                          mainHandler.post(() -> {
                              availableModels = models;
                              populateModels();
                              setApiStatus("Bağlantı başarılı · " + Math.max(0, models.size() - 1) + " model alındı", false);
                              connectButton.setEnabled(true);
                              toast("OpenRouter bağlantısı kuruldu.");
                          });
                      } catch (Exception e) {
                          mainHandler.post(() -> {
                              setApiStatus("Bağlantı hatası: " + safeMessage(e), true);
                              connectButton.setEnabled(true);
                          });
                      }
                  });
              }

              private void loadModels(boolean announce) {
                  String apiKey = keyInput.getText().toString().trim();
                  if (apiKey.isEmpty()) return;
                  worker.execute(() -> {
                      try {
                          List<OpenRouterClient.Model> models = OpenRouterClient.fetchModels(apiKey);
                          mainHandler.post(() -> {
                              availableModels = models;
                              populateModels();
                              setApiStatus("OpenRouter bağlantısı doğrulandı · " + Math.max(0, models.size() - 1) + " model", false);
                              if (announce) toast("Model listesi güncellendi.");
                          });
                      } catch (Exception e) {
                          mainHandler.post(() -> setApiStatus("Model listesi alınamadı: " + safeMessage(e), true));
                      }
                  });
              }

              private void populateModels() {
                  if (modelSpinner == null) return;
                  String previous = getSelectedModel();
                  List<OpenRouterClient.Model> shown = new ArrayList<>();
                  for (OpenRouterClient.Model model : availableModels) {
                      if (!freeOnly.isChecked() || model.free) shown.add(model);
                  }
                  if (shown.isEmpty()) shown.add(new OpenRouterClient.Model(
                          "openrouter/free", "OpenRouter otomatik ücretsiz model", true));
                  ArrayAdapter<OpenRouterClient.Model> adapter = new ArrayAdapter<>(this,
                          android.R.layout.simple_spinner_item, shown);
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  modelSpinner.setAdapter(adapter);
                  modelSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      @Override public void onItemSelected(android.widget.AdapterView<?> parent, View view, int position, long id) {
                          Object item = parent.getItemAtPosition(position);
                          if (item instanceof OpenRouterClient.Model) {
                              getSharedPreferences("settings", MODE_PRIVATE).edit()
                                      .putString("selected_model", ((OpenRouterClient.Model) item).id).apply();
                          }
                      }
                      @Override public void onNothingSelected(android.widget.AdapterView<?> parent) { }
                  });
                  int selected = 0;
                  for (int i = 0; i < shown.size(); i++) {
                      if (shown.get(i).id.equals(previous)) { selected = i; break; }
                  }
                  modelSpinner.setSelection(selected);
                  getSharedPreferences("settings", MODE_PRIVATE).edit()
                          .putString("selected_model", shown.get(selected).id).apply();
              }

              private String getSelectedModel() {
                  if (modelSpinner != null && modelSpinner.getSelectedItem() instanceof OpenRouterClient.Model) {
                      return ((OpenRouterClient.Model) modelSpinner.getSelectedItem()).id;
                  }
                  return getSharedPreferences("settings", MODE_PRIVATE)
                          .getString("selected_model", "openrouter/free");
              }

              private void sendTypedMessage() {
                  String value = messageInput.getText().toString().trim();
                  if (value.isEmpty()) return;
                  messageInput.setText("");
                  addMessage("user", value);
                  requestAi(value, "");
              }

              private void analyzeCurrentScreen() {
                  if (!isAccessibilityEnabled()) {
                      addMessage("assistant", "Ekran okuma izni etkin değil. Önce Android erişilebilirlik ayarlarından bu hizmeti açın.");
                      refreshPermissionStatus();
                      return;
                  }
                  String snapshot = ScreenAccessibilityService.captureForUser();
                  if (snapshot.isEmpty()) {
                      addMessage("assistant", "Ekran hizmeti henüz bağlanmadı. İzin durumunu kontrol edin.");
                      return;
                  }
                  addMessage("user", "Açık ekrandaki içerikleri analiz et ve sıradaki adımı Türkçe açıkla.");
                  requestAi("Açık ekrandaki içerikleri analiz et. Kullanıcının önceki talimatlarıyla ilişkiliyse yalnızca uygun tek bir sonraki eylemi öner.", snapshot);
              }

              private void requestAi(String prompt, String screenText) {
                  if (busy) { toast("Bir işlem sürüyor. Önce Durdur'a basın."); return; }
                  String apiKey = keyInput.getText().toString().trim();
                  if (apiKey.isEmpty()) {
                      addMessage("assistant", "OpenRouter kullanmak için önce API anahtarınızı girip bağlantıyı test edin.");
                      return;
                  }
                  String model = getSelectedModel();
                  StringBuilder userContent = new StringBuilder(prompt);
                  if (screenText != null && !screenText.isEmpty()) {
                      userContent.append("\n\n--- KULLANICININ ANALİZ İÇİN PAYLAŞTIĞI EKRAN METNİ ---\n")
                              .append(screenText).append("\n--- EKRAN METNİ SONU ---");
                  }
                  busy = true;
                  setActivity("AI düşünüyor…");
                  sendButton.setEnabled(false);
                  activeTask = worker.submit(() -> {
                      try {
                          String answer = OpenRouterClient.chat(apiKey, model, SYSTEM_PROMPT, userContent.toString());
                          if (Thread.currentThread().isInterrupted()) return;
                          ParsedAnswer parsed = parseAnswer(answer);
                          mainHandler.post(() -> {
                              addMessage("assistant", parsed.reply);
                              if (voiceOutput.isChecked() && tts != null) {
                                  tts.speak(parsed.reply, TextToSpeech.QUEUE_FLUSH, null, "assistant_reply");
                              }
                              if (parsed.action != null) showPendingAction(parsed.action);
                              finishTask("Hazır");
                          });
                      } catch (Exception e) {
                          if (Thread.currentThread().isInterrupted()) return;
                          mainHandler.post(() -> {
                              addMessage("assistant", "İstek tamamlanamadı: " + safeMessage(e));
                              finishTask("Hata");
                          });
                      }
                  });
              }

              private static final class ParsedAnswer {
                  final String reply;
                  final PendingAction action;
                  ParsedAnswer(String reply, PendingAction action) { this.reply = reply; this.action = action; }
              }

              private ParsedAnswer parseAnswer(String raw) {
                  try {
                      String candidate = raw.trim();
                      if (candidate.startsWith("```")) {
                          candidate = candidate.replaceFirst("^```[a-zA-Z]*\\s*", "");
                          candidate = candidate.replaceFirst("\\s*```$", "");
                      }
                      int first = candidate.indexOf('{');
                      int last = candidate.lastIndexOf('}');
                      if (first >= 0 && last > first) candidate = candidate.substring(first, last + 1);
                      JSONObject json = new JSONObject(candidate);
                      String reply = json.optString("reply", "İşlem yanıtı alındı.");
                      JSONObject actionJson = json.optJSONObject("action");
                      PendingAction action = null;
                      if (actionJson != null) {
                          String type = actionJson.optString("type", "NONE").toUpperCase(Locale.ROOT);
                          String target = actionJson.optString("target", "").trim();
                          if (type.equals("OPEN_APP") || type.equals("CLICK_TEXT") ||
                                  type.equals("SCROLL_FORWARD") || type.equals("SCROLL_BACKWARD")) {
                              if (!type.startsWith("SCROLL") && target.isEmpty()) return new ParsedAnswer(reply, null);
                              action = new PendingAction(type, target);
                          }
                      }
                      return new ParsedAnswer(reply, action);
                  } catch (Exception ignored) {
                      return new ParsedAnswer(raw, null);
                  }
              }

              private void showPendingAction(PendingAction action) {
                  pendingAction = action;
                  String label;
                  if (action.type.equals("OPEN_APP")) label = "Uygulama aç: " + action.target;
                  else if (action.type.equals("CLICK_TEXT")) label = "Ekrandaki öğeye tıkla: “" + action.target + "”";
                  else if (action.type.equals("SCROLL_FORWARD")) label = "Ekranı aşağı kaydır";
                  else label = "Ekranı yukarı kaydır";
                  pendingText.setText("AI işlem öneriyor\n" + label + "\n\nBu eylem siz Onayla'ya basmadan çalıştırılmaz.");
                  pendingBox.setVisibility(View.VISIBLE);
              }

              private void approvePendingAction() {
                  PendingAction action = pendingAction;
                  if (action == null) return;
                  String result;
                  switch (action.type) {
                      case "OPEN_APP": result = openAllowedApp(action.target); break;
                      case "CLICK_TEXT": result = ScreenAccessibilityService.clickText(action.target); break;
                      case "SCROLL_FORWARD": result = ScreenAccessibilityService.scroll(true); break;
                      case "SCROLL_BACKWARD": result = ScreenAccessibilityService.scroll(false); break;
                      default: result = "Desteklenmeyen işlem.";
                  }
                  addMessage("assistant", result);
                  clearPendingAction(null);
                  setActivity("Hazır");
              }

              private String openAllowedApp(String requested) {
                  String key = requested.toLowerCase(Locale.ROOT).trim();
                  String[] packages;
                  if (key.equals("tiktok")) packages = new String[]{"com.zhiliaoapp.musically", "com.ss.android.ugc.trill"};
                  else if (key.equals("youtube")) packages = new String[]{"com.google.android.youtube"};
                  else if (key.equals("chrome")) packages = new String[]{"com.android.chrome"};
                  else if (key.equals("settings")) {
                      try {
                          Intent intent = new Intent(android.provider.Settings.ACTION_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          return "Android Ayarları açıldı.";
                      } catch (Exception e) { return "Ayarlar açılamadı: " + safeMessage(e); }
                  } else return "Güvenlik nedeniyle yalnızca TikTok, YouTube, Chrome veya Android Ayarları açılabilir.";

                  for (String packageName : packages) {
                      try {
                          Intent launch = getPackageManager().getLaunchIntentForPackage(packageName);
                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launch);
                              return requested + " açıldı. Sonraki adım için ekranı analiz edebilirsiniz.";
                          }
                      } catch (Exception ignored) { }
                  }
                  return requested + " bu telefonda bulunamadı veya başlatılamadı.";
              }

              private void clearPendingAction(String message) {
                  pendingAction = null;
                  pendingBox.setVisibility(View.GONE);
                  if (message != null) addMessage("assistant", message);
              }

              private void stopCurrentWork() {
                  if (activeTask != null) activeTask.cancel(true);
                  activeTask = null;
                  busy = false;
                  clearPendingAction(null);
                  finishTask("Kullanıcı tarafından durduruldu");
                  addMessage("assistant", "Devam eden istek iptal edildi. Henüz onaylanmamış hiçbir eylem çalıştırılmadı.");
              }

              private void finishTask(String status) {
                  busy = false;
                  sendButton.setEnabled(true);
                  setActivity(status);
              }

              private void addMessage(String role, String message) {
                  if (chatList == null) return;
                  LinearLayout bubble = new LinearLayout(this);
                  bubble.setOrientation(LinearLayout.VERTICAL);
                  bubble.setPadding(dp(10), dp(8), dp(10), dp(8));
                  int fill = role.equals("user") ? 0xFF282544 : 0xFF171B28;
                  bubble.setBackground(round(fill, role.equals("user") ? 0xFF5E54A7 : 0xFF30364A, 1, 12));
                  TextView label = text(role.equals("user") ? "SİZ" : "ASİSTAN", 10,
                          role.equals("user") ? 0xFFBEB7FF : 0xFF9BE1D1, true);
                  TextView body = text(message, 13, 0xFFECEBF5, false);
                  body.setTextIsSelectable(true);
                  bubble.addView(label);
                  bubble.addView(body, top(4));
                  LinearLayout.LayoutParams lp = bottom(7);
                  lp.width = ViewGroup.LayoutParams.MATCH_PARENT;
                  chatList.addView(bubble, lp);
              }

              private void initializeTts() {
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS && tts != null) {
                          int language = tts.setLanguage(new Locale("tr", "TR"));
                          if (language == TextToSpeech.LANG_MISSING_DATA || language == TextToSpeech.LANG_NOT_SUPPORTED) {
                              mainHandler.post(() -> toast("Türkçe ses paketi cihazda bulunamadı."));
                          }
                      }
                  });
              }

              private void startVoiceInput() {
                  if (listening) {
                      if (speechRecognizer != null) speechRecognizer.stopListening();
                      listening = false;
                      micButton.setText("🎙");
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_AUDIO);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      toast("Bu cihazda konuşma tanıma servisi bulunamadı.");
                      return;
                  }
                  if (speechRecognizer == null) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      speechRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) { setActivity("Dinliyorum…"); }
                          @Override public void onBeginningOfSpeech() { }
                          @Override public void onRmsChanged(float rmsdB) { }
                          @Override public void onBufferReceived(byte[] buffer) { }
                          @Override public void onEndOfSpeech() { listening = false; micButton.setText("🎙"); }
                          @Override public void onError(int error) {
                              listening = false;
                              micButton.setText("🎙");
                              setActivity("Ses tanıma hatası");
                              toast("Ses algılanamadı. Tekrar deneyin.");
                          }
                          @Override public void onResults(Bundle results) {
                              listening = false;
                              micButton.setText("🎙");
                              ArrayList<String> matches = results == null ? null :
                                      results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  String spoken = matches.get(0).trim();
                                  addMessage("user", spoken);
                                  requestAi(spoken, "");
                              }
                              setActivity("Hazır");
                          }
                          @Override public void onPartialResults(Bundle partialResults) { }
                          @Override public void onEvent(int eventType, Bundle params) { }
                      });
                  }
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR");
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "tr-TR");
                  intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  listening = true;
                  micButton.setText("Durdur");
                  speechRecognizer.startListening(intent);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_AUDIO && grantResults.length > 0 &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED) startVoiceInput();
                  else if (requestCode == REQUEST_AUDIO) toast("Mikrofon izni verilmedi.");
              }

              private boolean isAccessibilityEnabled() {
                  AccessibilityManager manager = (AccessibilityManager) getSystemService(ACCESSIBILITY_SERVICE);
                  if (manager == null) return false;
                  for (android.accessibilityservice.AccessibilityServiceInfo info :
                          manager.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)) {
                      String id = info.getId();
                      if (id != null && id.contains(getPackageName()) && id.contains("ScreenAccessibilityService")) return true;
                  }
                  return ScreenAccessibilityService.isConnected();
              }

              private void refreshPermissionStatus() {
                  if (accessStatus == null) return;
                  boolean enabled = isAccessibilityEnabled();
                  accessStatus.setText(enabled ? "● Ekran erişimi etkin" : "● Ekran erişimi kapalı");
                  accessStatus.setTextColor(enabled ? 0xFF7FE0B5 : 0xFFFFD28A);
              }

              private void setApiStatus(String value, boolean error) {
                  if (apiStatus == null) return;
                  apiStatus.setText(value);
                  apiStatus.setTextColor(error ? 0xFFFF9B9B : 0xFF9BE1D1);
              }

              private void setActivity(String value) {
                  if (activityStatus != null) activityStatus.setText(value);
              }

              private String safeMessage(Exception e) {
                  String message = e.getMessage();
                  if (message == null || message.trim().isEmpty()) return "Bilinmeyen hata";
                  return message.length() > 260 ? message.substring(0, 260) + "…" : message;
              }

              private void toast(String message) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshPermissionStatus();
              }

              @Override
              protected void onDestroy() {
                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                      speechRecognizer = null;
                  }
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }
                  worker.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekran-asistani-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
